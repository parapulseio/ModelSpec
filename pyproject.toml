[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "modelspec"
dynamic = ["version"]
description = "ParaPulse ModelSpec — extract and normalize LLM model specifications from multiple sources"
readme = "docs/overview.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2",
    "huggingface_hub>=0.20",
    "requests>=2.28",
]

[project.optional-dependencies]
gguf = ["gguf>=0.10"]
yaml = ["PyYAML>=6"]
verify = ["jsonschema>=4"]
dev = ["pytest>=7", "PyYAML>=6", "gguf>=0.10", "jsonschema>=4"]
all = ["modelspec[gguf,yaml,verify]"]

[project.scripts]
modelspec = "modelspec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["modelspec"]

[tool.hatch.version]
source = "vcs"
# Lets `pip install -e .` work in a shallow clone / tarball with no tags
# (e.g. some CI checkouts) instead of hard-failing on version resolution.
fallback-version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

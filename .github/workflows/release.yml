name: Release

# Triggered by pushing an annotated/lightweight tag matching v*.*.* (e.g. v0.2.0).
# The version number lives nowhere but git tags (see [tool.hatch.version] in
# pyproject.toml, source = "vcs") — cutting a release IS the act of tagging.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: hatch-vcs needs to see the tag being released
          # (and the preceding one) to resolve the exact version number.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (all extras) + build tooling
        run: python -m pip install -e ".[dev]" build

      - name: Run tests
        run: pytest -q

      - name: Verify the tag resolves to an exact (non-dev) version
        run: |
          python -c "
          import modelspec
          v = modelspec.__version__
          assert '.dev' not in v and '+' not in v, f'refusing to release a dirty/dev version: {v}'
          print(f'releasing modelspec {v}')
          "

      - name: Build sdist + wheel
        run: python -m build

      - name: Export the JSON Schema
        # A standalone, versioned artifact for third parties who only want to
        # validate ModelSpec documents (e.g. via `modelspec verify` or any
        # generic JSON Schema tool) without installing the Python package.
        run: modelspec schema > modelspec.schema.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            modelspec.schema.json
